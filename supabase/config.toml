# Lokale ontwikkeling, geen gekoppeld hosted project. CLI 3.1.0.
project_id = "VVPSponsor"
[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
auto_expose_new_tables = false
[db]
port = 54322
shadow_port = 54320
major_version = 17
health_timeout = "2m"
[db.migrations]
enabled = true
schema_paths = []
[db.seed]
enabled = false
sql_paths = []
[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 12
[auth.email]
enabled = true
enable_confirmations = true
secure_password_change = true
[studio]
enabled = false
[local_smtp]
enabled = true
port = 54324
[realtime]
enabled = false
[storage]
enabled = true
[edge_runtime]
enabled = false
[analytics]
enabled = false

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email.template.recovery]
subject = "VV Pernis — wachtwoord herstellen"
content_path = "./supabase/templates/recovery.html"
[auth.email.template.invite]
subject = "VV Pernis — uitnodiging"
content_path = "./supabase/templates/invite.html"
